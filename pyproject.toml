[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alpha-research-pipeline"
version = "0.1.0"
description = "Statistically rigorous cross-sectional alpha research pipeline."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "plotly>=5.18",
    "pyarrow>=14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
]
boosting = [
    "lightgbm>=4.0",
    "xgboost>=2.0",
]
data = [
    "yfinance>=0.2",
]

[project.scripts]
alpha-demo = "alpha_pipeline.cli:main"
alpha-memo = "alpha_pipeline.memo:main"
alpha-dashboard = "dashboard.__main__:main"

[tool.setuptools]
packages = ["alpha_pipeline", "dashboard"]

[tool.setuptools.package-dir]
alpha_pipeline = "src/alpha_pipeline"
dashboard = "dashboard"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
